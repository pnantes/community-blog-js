<div class="modal__login">
    <button type="button" class="login__close">
      <p>X</p>
    </button>

    <h2>Login</h2>

    <form class="modal__form">
      <input type="email" id="email__login" placeholder="E-mail" />
      <input type="password" id="password__login" placeholder="Senha" />
      <button type="button" class="button">
        Login
      </button>
    </form>

  </div>


  <div class="modal__cadastro">
    <button type="button" class="cadastro__close">
      <p>X</p>
    </button>

    <h2>Cadastro</h2>

    <form class="modal__form">
      <input id="user" placeholder="Nome de usuário" />
      <input type="email" id="email__cadastro" placeholder="E-mail" />
      <input id="image" placeholder="Foto de perfil" />
      <input type="password" id="password__cadastro" placeholder="Senha" />
      <button type="button" class="button">
        Cadastrar
      </button>
    </form>

  </div>
